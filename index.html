<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d0e10">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ledger">
  <meta name="format-detection" content="telephone=no">
  <title>Ledger</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* ホーム画面アプリ（iOS 27）では画面下の約60ptがiOSに確保され、描画されない。
       そのときはホームバーもその中に入るため、タブバー下のホームバー用余白を消す */
    (function () {
      var root = document.documentElement;
      var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      if (!standalone) return;
      root.classList.add('standalone');
      function fit() {
        var portrait = innerHeight >= innerWidth;
        var full = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
        var gap = full - innerHeight;
        if (gap >= 20 && gap <= 140) root.style.setProperty('--safe-b', '0px');
        else root.style.removeProperty('--safe-b');
      }
      fit();
      addEventListener('resize', fit);
      addEventListener('orientationchange', function () { setTimeout(fit, 300); });
    })();
  </script>
</head>
<body>
  <div id="app">
    <main id="views">
      <!-- 出費（合計・サブスク・買い物） -->
      <section class="view active" id="view-summary">
        <header class="topbar">
          <button class="icon-btn" data-month-step="-1" aria-label="前の月"></button>
          <button class="month-label" data-month-today></button>
          <button class="icon-btn" data-month-step="1" aria-label="次の月"></button>
        </header>
        <nav class="seg" id="summary-seg">
          <button data-page="0">合計</button>
          <button data-page="1">サブスク</button>
          <button data-page="2">買い物</button>
          <span class="seg-indicator"></span>
        </nav>
        <div class="pager" id="pager">
          <div class="page" id="page-all"></div>
          <div class="page" id="page-sub"></div>
          <div class="page" id="page-shop"></div>
        </div>
      </section>

      <!-- カレンダー -->
      <section class="view" id="view-calendar">
        <header class="topbar">
          <button class="icon-btn" data-month-step="-1" aria-label="前の月"></button>
          <button class="month-label" data-month-today></button>
          <button class="icon-btn" data-month-step="1" aria-label="次の月"></button>
        </header>
        <div class="cal-total" id="cal-total"></div>
        <div class="cal-week" id="cal-week"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-day" id="cal-day"></div>
      </section>

      <!-- 履歴 -->
      <section class="view" id="view-history">
        <header class="topbar plain"><h1>履歴</h1></header>
        <div class="search">
          <span class="search-icon" data-icon="search"></span>
          <input id="history-q" type="search" placeholder="名前・メモで検索" autocomplete="off">
        </div>
        <div class="chips" id="history-filter"></div>
        <div class="scroll" id="history-list"></div>
      </section>

      <!-- 設定 -->
      <section class="view" id="view-settings">
        <header class="topbar plain"><h1>設定</h1></header>
        <div class="scroll" id="settings-body"></div>
      </section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-view="summary"><span data-icon="gauge"></span><small>出費</small></button>
      <button class="tab" data-view="calendar"><span data-icon="calendar"></span><small>カレンダー</small></button>
      <button class="fab" id="fab" aria-label="項目を追加"><span data-icon="plus"></span></button>
      <button class="tab" data-view="history"><span data-icon="history"></span><small>履歴</small></button>
      <button class="tab" data-view="settings"><span data-icon="sliders"></span><small>設定</small></button>
    </nav>

    <div class="sheet-layer" id="sheet-layer">
      <div class="sheet-backdrop"></div>
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
